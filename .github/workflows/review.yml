name: Static AI review
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
permissions: {}
# Both mutating jobs use the same lock. Inference holds no GitHub write credential.
jobs:
  prepare:
    name: Prepare static review
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'ai-cr:review') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' && github.event.sender.type != 'Bot' &&
      (vars.AI_REVIEW_OWNER == '' ||
       (github.event.pull_request.user.login == vars.AI_REVIEW_OWNER &&
        github.actor == vars.AI_REVIEW_OWNER))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    concurrency:
      group: ai-review-mutations-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    outputs:
      eligible: ${{ steps.pending.outputs.eligible }}
    env:
      AI_REVIEW_OWNER: ${{ vars.AI_REVIEW_OWNER }}
      AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: trusted
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: trusted/.nvmrc
      - name: Open pending check before fallible preparation
        id: pending
        run: node trusted/packages/ai-reviewer/src/cli/prepare.mjs pending "$RUNNER_TEMP/review-data"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install trusted reviewer
        if: steps.pending.outputs.eligible == 'true'
        run: npm ci --ignore-scripts --prefix trusted/packages/ai-reviewer
      - name: Fetch head objects as data
        if: steps.pending.outputs.eligible == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git -C trusted -c core.hooksPath=/dev/null fetch --no-tags origin "$HEAD_SHA"
      - name: Build bounded input
        if: steps.pending.outputs.eligible == 'true'
        run: node trusted/packages/ai-reviewer/src/cli/prepare.mjs input "$RUNNER_TEMP/review-data"
        env:
          TRUSTED_CHECKOUT: ${{ github.workspace }}/trusted
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assemble trusted package artifact
        if: steps.pending.outputs.eligible == 'true'
        run: |
          mkdir -p bundle/packages
          cp -R trusted/packages/ai-reviewer bundle/packages/ai-reviewer
          cp trusted/.nvmrc bundle/.nvmrc
          cp -R "$RUNNER_TEMP/review-data" bundle/data
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success() && steps.pending.outputs.eligible == 'true'
        with:
          name: review-input-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle/
          include-hidden-files: true
          retention-days: 7
  review:
    name: Run static inference
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: review-input-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: prepared/.nvmrc
      - uses: ./prepared/packages/ai-reviewer
        with:
          context: ${{ github.workspace }}/prepared/data/context.json
          input: ${{ github.workspace }}/prepared/data/input.json
          model: ${{ vars.AI_REVIEW_MODEL }}
          output: ${{ github.workspace }}/prepared/data/envelope.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: review-output-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            prepared/data/context.json
            prepared/data/envelope.json
          retention-days: 7
  publish:
    name: Publish static review
    needs: [prepare, review]
    if: >-
      always() && (github.event.action != 'labeled' || github.event.label.name == 'ai-cr:review') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' && github.event.sender.type != 'Bot' &&
      (vars.AI_REVIEW_OWNER == '' ||
       (github.event.pull_request.user.login == vars.AI_REVIEW_OWNER &&
        github.actor == vars.AI_REVIEW_OWNER))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    concurrency:
      group: ai-review-mutations-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    env:
      AI_REVIEW_OWNER: ${{ vars.AI_REVIEW_OWNER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: trusted
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: trusted/.nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: review-output-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: result
      - name: Install validation dependency when available
        continue-on-error: true
        run: npm ci --ignore-scripts --prefix trusted/packages/ai-reviewer
      - name: Complete even without preparation artifacts
        if: always()
        run: node trusted/packages/ai-reviewer/src/cli/publish.mjs result
        env:
          GITHUB_TOKEN: ${{ github.token }}
